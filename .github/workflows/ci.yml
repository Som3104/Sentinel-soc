# Continuous integration: runs on every push and pull request.
# A red X on GitHub means something broke; the job log says what.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:                       # a newer push cancels the older run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Docker image
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run 61 tests (rules, ML, incidents, response, lab, auth)
        working-directory: backend
        run: pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci                # exact versions from package-lock.json
      - run: npm run build         # fails on syntax errors and broken imports

  end-to-end:
    name: End-to-end on PostgreSQL
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: socpass
          POSTGRES_DB: socdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soc -d socdb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://soc:socpass@localhost:5432/socdb
      SECRET_KEY: ci-only-secret
      SOC_AUTOTRAIN: "0"           # rules-only here; the ML models are covered by the unit tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Start the API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat ../api.log; exit 1
      - name: Send 30 minutes of traffic with all 7 attacks
        run: python simulator/simulator.py --seed 21
      - name: Check detection, incidents, response and auth
        run: python scripts/smoke_test.py
      - name: API log (on failure)
        if: failure()
        run: cat api.log

  docker-image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mini-soc-backend ./backend
